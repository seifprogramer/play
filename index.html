<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Game Arcade</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a12;color:#e0e0e0;font-family:system-ui,sans-serif}
.header{background:#1a1a2e;padding:14px 18px;border-bottom:1px solid #2a2a4a;position:sticky;top:0;z-index:100}
.header-inner{max-width:1300px;margin:0 auto;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.logo{font-size:1.3rem;font-weight:800;background:linear-gradient(90deg,#a855f7,#6366f1);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.search{flex:1;min-width:180px}
.search input{width:100%;padding:9px 14px;border-radius:10px;border:1px solid #2a2a4a;background:#0f0f1a;color:#fff;outline:none}
.filters{max-width:1300px;margin:0 auto;padding:10px 18px;display:flex;gap:6px;overflow-x:auto}
.filters::-webkit-scrollbar{display:none}
.filter-btn{padding:7px 14px;border-radius:18px;border:1px solid #2a2a4a;background:#12121f;color:#a0a0b0;font-size:.8rem;cursor:pointer;white-space:nowrap}
.filter-btn.active{background:linear-gradient(135deg,#7c3aed,#6366f1);color:#fff;border-color:transparent}
.player{max-width:1300px;margin:0 auto;padding:0 18px 16px}
.player-card{background:#12121f;border-radius:14px;border:1px solid #2a2a4a;overflow:hidden}
.player-hd{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;background:#1a1a2e;border-bottom:1px solid #2a2a4a;flex-wrap:wrap;gap:6px}
.player-title{font-size:.95rem;font-weight:600;color:#fff}
.btn{padding:7px 14px;border-radius:8px;border:none;font-size:.8rem;cursor:pointer;font-weight:600}
.btn-p{background:linear-gradient(135deg,#7c3aed,#6366f1);color:#fff}
.btn-d{background:#2a2a4a;color:#e0e0e0}
.iframe-wrap{position:relative;width:100%;padding-bottom:56.25%;height:0;background:#000}
.iframe-wrap iframe{position:absolute;top:0;left:0;width:100%;height:100%;border:none}
.grid{max-width:1300px;margin:0 auto;padding:0 18px 30px}
.grid-title{font-size:1rem;font-weight:700;margin-bottom:12px}
.game-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.game-card{background:#12121f;border-radius:12px;border:1px solid #1e1e32;overflow:hidden;cursor:pointer;transition:.2s;position:relative}
.game-card:hover{transform:translateY(-2px);border-color:#7c3aed}
.game-card img{width:100%;aspect-ratio:1;object-fit:cover;display:block}
.game-card-body{padding:8px}
.game-card-title{font-size:.75rem;font-weight:600;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lock{position:absolute;inset:0;background:rgba(0,0,0,.75);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:8px;text-align:center}
.lock-icon{font-size:1.6rem}
.lock-text{font-size:.65rem;color:#ccc;line-height:1.3}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(100px);background:linear-gradient(135deg,#7c3aed,#6366f1);color:#fff;padding:12px 24px;border-radius:12px;font-size:.9rem;font-weight:600;z-index:1000;transition:.4s;opacity:0}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1}
.stats{max-width:1300px;margin:0 auto;padding:0 18px 10px;font-size:.8rem;color:#888;display:flex;gap:16px;flex-wrap:wrap}
@media(max-width:640px){.game-grid{grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:8px}}
</style>
<base target="_blank">
<base target="_blank">
</head>
<body>

<div class="header">
  <div class="header-inner">
    <div class="logo">🎮 Arcade</div>
    <div class="search"><input id="search" placeholder="Search..." autocomplete="off"></div>
  </div>
</div>

<div class="stats" id="stats"></div>
<div style="max-width:1300px;margin:0 auto;padding:0 18px 8px">
  <button class="btn btn-d" onclick="redeem()" style="font-size:.75rem;padding:5px 12px">🎁 Redeem Code</button>
  <button class="btn btn-d" onclick="resetProgress()" style="font-size:.75rem;padding:5px 12px;margin-left:6px">🔄 Reset Progress</button>
</div>

<div class="filters">
  <button class="filter-btn active" data-c="all">All</button>
  <button class="filter-btn" data-c="FPS & Shooters">🔫 FPS</button>
  <button class="filter-btn" data-c="Racing & Driving">🏎️ Racing</button>
  <button class="filter-btn" data-c="Action & Fighting">⚔️ Action</button>
  <button class="filter-btn" data-c="Survival & Horror">🧟 Horror</button>
  <button class="filter-btn" data-c="Obby & Platformer">🏃 Obby</button>
  <button class="filter-btn" data-c="Simulation & Tycoon">🏗️ Tycoon</button>
  <button class="filter-btn" data-c="Multiplayer & PvP">👥 PvP</button>
  <button class="filter-btn" data-c="Adventure & RPG">🗺️ RPG</button>
  <button class="filter-btn" data-c="Arcade & Skill">🕹️ Arcade</button>
</div>

<div class="player">
  <div class="player-card">
    <div class="player-hd">
      <span class="player-title" id="ptitle">👆 Pick a game</span>
      <div>
        <button class="btn btn-d" id="infoBtn" onclick="alert(GAMES.find(x=>x.id===currentId)?.desc||'')" style="display:none">ℹ️</button>
        <button class="btn btn-p" id="fsBtn" onclick="document.querySelector('.player').requestFullscreen()" style="display:none">⛶</button>
      </div>
    </div>
    <div class="iframe-wrap" id="iframeWrap">
      <div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#444">Select a game to play</div>
    </div>
  </div>
</div>

<div class="grid">
  <div class="grid-title" id="gtitle">🌟 Games</div>
  <div class="game-grid" id="grid"></div>
</div>

<div class="toast" id="toast"></div>

cing", "arcade"], "tags": ["race-games", "offroad-games", "destruction-games"], "desc": "Mad Truck Challenge Special is a racing game where you try to destroy and overtake your opponents with your monster truck. \nRace and finish all the levels in different exotic place...", "mobile": ["For Android", "For IOS", "For Desktop"], "locked": true, "task": {"t": "plays", "need": 15, "lbl": "Play 15 different games"}, "category": "Racing & Driving"}];

let unlocked=new Set(JSON.parse(localStorage.getItem('u')||'[]'));
let playTime=JSON.parse(localStorage.getItem('t')||'{}');
let playedGames=new Set(JSON.parse(localStorage.getItem('p')||'[]'));
let activeCat='all',searchQ='',currentId=null,timer=null;

GAMES.slice(0,3).forEach(g=>unlocked.add(g.id));

function save(){localStorage.setItem('u',JSON.stringify([...unlocked]));localStorage.setItem('t',JSON.stringify(playTime));localStorage.setItem('p',JSON.stringify([...playedGames]))}

function resetProgress(){
  if(!confirm('Reset all progress? This will re-lock all games except the default free ones and clear your play history.'))return;
  unlocked.clear();
  playTime={};
  playedGames.clear();
  localStorage.removeItem('u');
  localStorage.removeItem('t');
  localStorage.removeItem('p');
  GAMES.slice(0,3).forEach(g=>unlocked.add(g.id));
  save();
  render();
  updateStats();
  show('🔄 Progress reset!');
}
function check(){
  let n=false;
  GAMES.forEach(g=>{
    if(unlocked.has(g.id)||!g.task)return;
    const t=g.task;
    if(t.t==='time'&&(playTime[t.tgt]||0)>=t.need){unlocked.add(g.id);n=true}
    else if(t.t==='plays'&&playedGames.size>=t.need){unlocked.add(g.id);n=true}
  });
  if(n){save();render();show('🎉 New game unlocked!')}
}
function show(m){const e=document.getElementById('toast');e.textContent=m;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),2500)}

function startTimer(id){
  if(timer)clearInterval(timer);
  timer=setInterval(()=>{
    playTime[id]=(playTime[id]||0)+1;
    if(playTime[id]%30===0){save();check()}
    updateStats();
  },1000);
}

function updateStats(){
  const tm=Math.floor(Object.values(playTime).reduce((a,b)=>a+b,0)/60);
  document.getElementById('stats').innerHTML=`⏱️ ${tm}min &nbsp;|&nbsp; 🎮 ${playedGames.size} games &nbsp;|&nbsp; 🔓 ${unlocked.size}/${GAMES.length}`;
}

function loadGame(id){
  const g=GAMES.find(x=>x.id===id);
  if(!g||(!unlocked.has(g.id)&&g.locked))return;
  currentId=id;playedGames.add(id);
  document.getElementById('ptitle').textContent=g.title;
  document.getElementById('iframeWrap').innerHTML=`<iframe src="${g.url}" allow="fullscreen;accelerometer;autoplay;encrypted-media;gyroscope" allowfullscreen></iframe>`;
  document.getElementById('infoBtn').style.display='inline-block';
  document.getElementById('fsBtn').style.display='inline-block';
  document.querySelector('.player').scrollIntoView({behavior:'smooth'});
  save();check();startTimer(id);updateStats();render();
}

function render(){
  let f=GAMES.filter(g=>{
    if(activeCat!=='all'&&g.category!==activeCat)return false;
    if(searchQ)return g.title.toLowerCase().includes(searchQ.toLowerCase());
    return true;
  });
  f.sort((a,b)=>{
    const ua=unlocked.has(a.id)?1:0,ub=unlocked.has(b.id)?1:0;
    return ub-ua;
  });
  document.getElementById('gtitle').innerHTML='🌟 Games <span style="color:#666;font-size:.8rem">('+f.length+')</span>';
  document.getElementById('grid').innerHTML=f.map(g=>{
    const ok=unlocked.has(g.id);
    return `<div class="game-card" onclick="loadGame('${g.id}')">`+
      `<img src="${g.icon}" loading="lazy">`+
      `<div class="game-card-body"><div class="game-card-title">${g.title}</div></div>`+
      (ok?'<div style="position:absolute;top:4px;right:4px;background:#22c55e;color:#fff;font-size:.6rem;padding:2px 6px;border-radius:6px;font-weight:700">FREE</div>':`<div class="lock"><div class="lock-icon">🔒</div><div class="lock-text">${g.task.lbl}</div></div>`)+
      `</div>`;
  }).join('');
}

document.querySelectorAll('.filter-btn').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('.filter-btn').forEach(x=>x.classList.remove('active'));
  b.classList.add('active');activeCat=b.dataset.c;render();
});
document.getElementById('search').oninput=e=>{searchQ=e.target.value;render();};

function redeem(){
  const c=prompt('Enter code:');
  if(c==='ARCADE2026'){
    GAMES.forEach(g=>unlocked.add(g.id));
    save();render();show('🔓 All games unlocked!');updateStats();
  }else if(c)show('❌ Invalid code');
}
check();updateStats();render();
</script>
